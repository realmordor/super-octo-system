[project]
name = "super-octo-system"
version = "0.1.0"
description = "Personal home dashboard — calendar, weather, trains, weekly menu and recipes"
readme = "README.md"
authors = [
    { name = "realmordor", email = "realmordor@github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "cachetools>=5.5.2",
    "dash>=4.1.0",
    "dash-bootstrap-components>=2.0.4",
    "google-api-python-client>=2.183.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.2",
    "pandas>=2.3.2",
    "python-dotenv>=1.1.1",
    "paramiko>=5.0.0",
    "stomp-py>=9.0.0",
    "dash-mantine-components>=2.8.0",
    "dash-iconify>=0.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
markers = [
    "integration: tests that call real external APIs (deselect with '-m not integration')",
]
